# Extended testing workflow
#
# Runs more comprehensive tests that are too slow for regular CI.
# Scheduled weekly and on-demand via workflow_dispatch.

name: Extended Tests

on:
  schedule:
    # Run every Sunday at 2:00 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: "Run performance benchmarks"
        required: false
        default: true
        type: boolean
      run_cluster_tests:
        description: "Run the three-node cluster tests and failover demo"
        required: false
        default: true
        type: boolean
      run_memory_check:
        description: "Run memory leak check (Valgrind)"
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # Performance benchmarks
  # ==========================================================================
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run_benchmarks == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # rust-cache is pinned to a release commit, never a branch head, so
      # Dependabot proposes releases (TD-2026-09-05).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install criterion dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnuplot

      - name: Run benchmarks
        run: |
          # Check if benches directory exists
          if [ -d "benches" ]; then
            cargo bench --locked --all-features -- --noplot
          else
            echo "No benchmarks directory found, skipping..."
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: target/criterion/
          retention-days: 30

  # ==========================================================================
  # Three-node cluster (ADR-0001 PR 3)
  # ==========================================================================
  # Replaces the former stress job, which never ran a test: its
  # `cargo test -- --ignored` matched none, its fallback only ran on failure,
  # and its Iggy service container went unused (the integration tests start
  # their own). Here the cluster tests are the ignored ones, named
  # explicitly, against the docker-compose.cluster.yaml stack.
  cluster-tests:
    name: Cluster Tests
    runs-on: ubuntu-latest
    # The gateway image is a release (LTO) build
    timeout-minutes: 45
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run_cluster_tests == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # A fresh pre-shared key per run: the nodes need one, and it guards
      # nothing beyond this runner. In GITHUB_ENV so the later compose calls
      # (which require it) see it too.
      - name: Generate the cluster secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "IGGY_CLUSTER_SHARED_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Start the cluster
        run: docker compose -f docker-compose.cluster.yaml up -d --build --wait --wait-timeout 900

      - name: Cluster tests
        run: cargo test --locked --test cluster_tests -- --ignored --test-threads=1

      - name: Failover demo
        run: scripts/cluster-failover-demo.sh

      - name: Cluster logs
        if: failure()
        run: docker compose -f docker-compose.cluster.yaml logs --no-color --tail 300

      - name: Stop the cluster
        if: always()
        run: docker compose -f docker-compose.cluster.yaml down -v

  # ==========================================================================
  # Memory leak detection (Valgrind)
  # ==========================================================================
  memory-check:
    name: Memory Check (Valgrind)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run_memory_check == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build test binary
        run: cargo test --locked --no-run --lib --all-features 2>&1 | grep -oP 'target/debug/deps/[^ ]+' | head -1 > test_binary.txt

      - name: Run Valgrind
        run: |
          TEST_BINARY=$(cat test_binary.txt)
          if [ -n "$TEST_BINARY" ] && [ -f "$TEST_BINARY" ]; then
            valgrind --leak-check=full \
                     --show-leak-kinds=definite,indirect \
                     --error-exitcode=1 \
                     --suppressions=valgrind.supp 2>/dev/null || true \
                     "$TEST_BINARY" --test-threads=1 2>&1 | tee valgrind-output.txt

            # Check for definite leaks
            if grep -q "definitely lost: [1-9]" valgrind-output.txt; then
              echo "::error::Memory leaks detected!"
              exit 1
            fi
          else
            echo "No test binary found, skipping Valgrind check"
          fi
        continue-on-error: true

  # ==========================================================================
  # Miri (undefined behavior detection)
  # ==========================================================================
  miri:
    name: Miri (UB Detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup Miri
        run: cargo miri setup

      - name: Run Miri on unit tests
        run: |
          # Run Miri on a subset of tests (some may not be compatible)
          cargo miri test --locked --lib 2>&1 || {
            echo "::warning::Some tests failed under Miri. This may be due to unsupported operations."
          }
        continue-on-error: true
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-ignore-leaks

  # ==========================================================================
  # Feature matrix testing
  # ==========================================================================
  feature-matrix:
    name: Feature Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""  # No features (default)
          - "--all-features"
          - "--no-default-features"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: features-${{ matrix.features }}

      - name: Build with features
        run: cargo build --locked ${{ matrix.features }}

      - name: Test with features
        run: cargo test --locked --lib ${{ matrix.features }}

  # ==========================================================================
  # Documentation coverage
  # ==========================================================================
  doc-coverage:
    name: Documentation Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check documentation coverage
        run: |
          RUSTDOCFLAGS="-Z unstable-options --show-coverage" cargo +nightly doc --locked --no-deps --all-features 2>&1 | tee doc-coverage.txt

          # Extract coverage percentage
          COVERAGE=$(grep -oP '\d+\.\d+%' doc-coverage.txt | tail -1 || echo "unknown")
          echo "Documentation coverage: $COVERAGE"

          # Upload as artifact
          echo "## Documentation Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage: $COVERAGE" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: doc-coverage
          path: doc-coverage.txt

  # ==========================================================================
  # Summary
  # ==========================================================================
  summary:
    name: Extended Tests Summary
    runs-on: ubuntu-latest
    needs: [benchmarks, cluster-tests, memory-check, miri, feature-matrix, doc-coverage]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Extended Tests Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmarks | ${{ needs.benchmarks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster Tests | ${{ needs.cluster-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Memory Check | ${{ needs.memory-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Miri | ${{ needs.miri.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Feature Matrix | ${{ needs.feature-matrix.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Doc Coverage | ${{ needs.doc-coverage.result }} |" >> $GITHUB_STEP_SUMMARY
