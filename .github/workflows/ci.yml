# Continuous Integration workflow for iggy-sample
#
# Runs on pushes to main and develop, on pull requests to main, and weekly.
# Includes: formatting, linting, testing, coverage, documentation, security
# audit, dependency policy, and shell-script linting.

name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]
    schedule:
        # Run every Monday at 2:00 AM UTC to catch dependency issues early
        - cron: "0 2 * * 1"

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
    # Minimum supported Rust version
    MSRV: "1.93.0"

# Cancel in-progress runs for the same branch and event. The event is part
# of the key because only the scheduled run files audit issues: a push to
# main must not cancel it, nor it the push run.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ==========================================================================
    # Formatting check (fast, run first)
    # ==========================================================================
    fmt:
        name: Rustfmt
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
              with:
                  toolchain: nightly
                  components: rustfmt
            - name: Check formatting
              run: cargo fmt --all -- --check

    # ==========================================================================
    # Clippy linting
    # ==========================================================================
    clippy:
        name: Clippy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
              with:
                  toolchain: stable
                  components: clippy
            # TD-2026-09-05: this file's rust-cache pins are a branch head, not
            # the release their comment names; re-pin every workflow's together.
            - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
            - name: Run Clippy
              run: cargo clippy --locked --all-targets --all-features -- -D warnings

    # ==========================================================================
    # Test matrix across OS and Rust versions
    # ==========================================================================
    test:
        name: Test (${{ matrix.os }}, ${{ matrix.rust }})
        runs-on: ${{ matrix.os }}
        needs: [fmt]
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                rust: [stable, beta]
                include:
                    # MSRV check on Ubuntu only
                    - os: ubuntu-latest
                      rust: "1.93.0"
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
              with:
                  toolchain: ${{ matrix.rust }}
            - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
              with:
                  key: ${{ matrix.os }}-${{ matrix.rust }}

            - name: Build
              run: cargo build --locked --all-features

            - name: Run unit tests
              run: cargo test --locked --lib --all-features

            - name: Run doc tests
              run: cargo test --locked --doc --all-features

    # ==========================================================================
    # Integration tests (requires Docker for testcontainers)
    # ==========================================================================
    integration:
        name: Integration Tests
        runs-on: ubuntu-latest
        needs: [fmt, clippy]
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
              with:
                  toolchain: stable
            - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

            - name: Run integration tests
              run: cargo test --locked --test '*' --all-features
              env:
                  # Testcontainers will pull and run Iggy server automatically
                  TESTCONTAINERS: true

    # ==========================================================================
    # Code coverage
    # ==========================================================================
    coverage:
        name: Code Coverage
        runs-on: ubuntu-latest
        needs: [test]
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
              with:
                  toolchain: stable
                  components: llvm-tools-preview
            - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

            - name: Install cargo-llvm-cov
              uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
              with:
                  tool: cargo-llvm-cov

            - name: Generate coverage report
              run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info

            # TD-2026-09-03: without a CODECOV_TOKEN secret Codecov rejects
            # this upload, and fail_ci_if_error: false keeps the job green.
            # Resolve the record before editing this step.
            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  files: lcov.info
                  fail_ci_if_error: false
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    # ==========================================================================
    # Documentation build
    # ==========================================================================
    docs:
        name: Documentation
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
              with:
                  toolchain: stable
            - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

            - name: Build documentation
              run: cargo doc --locked --no-deps --all-features
              env:
                  RUSTDOCFLAGS: -D warnings

    # ==========================================================================
    # Security audit
    # ==========================================================================
    audit:
        name: Security Audit
        runs-on: ubuntu-latest
        permissions:
            checks: write
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v7
            # main, not a release: upstream moved to Node 24 after v2.0.0
            # (dist/index.js unchanged) but has not tagged it yet. Dependabot
            # moves an untagged pin to main's head; switch back to a release
            # SHA once upstream tags one.
            - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

    # ==========================================================================
    # Dependency policy check (advisories, bans, licenses, sources; deny.toml)
    # ==========================================================================
    licenses:
        name: Dependency Policy (cargo-deny)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
              with:
                  toolchain: stable
            # No rust-cache here, deliberately: cargo-deny compiles nothing,
            # and its yanked check reads cargo's index cache, which
            # `cargo fetch --locked` does not refresh. A restored cache can
            # hold an entry fetched before a yank and hide it.

            - name: Install cargo-deny
              uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
              with:
                  tool: cargo-deny

            # -D index-failure: an index entry cargo-deny cannot read would
            # otherwise only warn, passing the check without it.
            - name: Check dependency policy (advisories, bans, licenses, sources)
              run: cargo deny --locked check -D index-failure

            # TD-2026-09-01 tripwire, production side. The API listener serves
            # cleartext HTTP/2 only because hyper-util's `http2` feature is in
            # the production graph (via metrics-exporter-prometheus). Test
            # builds also get it from dev-dependencies, so only this check
            # can see production lose it. If cargo calls `hyper-util`
            # ambiguous, a second version arrived: point -i at the version
            # axum::serve uses (hyper-util@X) rather than loosening the grep.
            - name: Pin the production HTTP/2 surface (TD-2026-09-01)
              run: |
                  tree=$(cargo tree --locked -e normal,build,features -i hyper-util)
                  if grep -q 'hyper-util feature "http2"' <<< "$tree"; then
                      echo "hyper-util/http2 is in the production graph: the API listener serves h2c"
                  else
                      echo "::error::hyper-util/http2 left the production graph, so the API listener is now HTTP/1-only; resolve TD-2026-09-01"
                      exit 1
                  fi

            # cargo refuses to build below rust-version; the image sat
            # unbuildable from 2026-07-04 until 0.4.1 because nothing checked.
            - name: Dockerfile toolchain is at or above rust-version
              run: |
                  image=$(sed -nE 's/^FROM rust:([0-9]+(\.[0-9]+){1,2})-.*/\1/p' Dockerfile)
                  msrv=$(sed -nE 's/^rust-version = "([0-9.]+)"/\1/p' Cargo.toml)
                  if [ -z "$image" ] || [ -z "$msrv" ]; then
                      echo "::error::could not read the Dockerfile's rust image ('$image') or rust-version ('$msrv')"
                      exit 1
                  fi
                  # Compare as X.Y.Z: `rust:1.93` means the latest 1.93.x, and
                  # sort -V would rank a bare "1.93" below "1.93.0".
                  pad() { case "$1" in *.*.*) echo "$1" ;; *.*) echo "$1.0" ;; *) echo "$1.0.0" ;; esac; }
                  image=$(pad "$image")
                  msrv=$(pad "$msrv")
                  if [ "$(printf '%s\n%s\n' "$msrv" "$image" | sort -V | head -n1)" != "$msrv" ]; then
                      echo "::error::Dockerfile builds with rust $image, below rust-version $msrv; cargo would refuse to build the image"
                      exit 1
                  fi
                  echo "Dockerfile rust $image is at or above rust-version $msrv"

    # ==========================================================================
    # Shell scripts (scripts/verify-release.sh runs after every release)
    # ==========================================================================
    shellcheck:
        name: Shellcheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            # Preinstalled on GitHub's ubuntu runners; -s bash because the
            # scripts are bash, and they must stay clean under it.
            - name: Lint shell scripts
              run: |
                  shellcheck --version
                  shellcheck -s bash scripts/*.sh

    # ==========================================================================
    # Final status check (for branch protection)
    # ==========================================================================
    ci-success:
        name: CI Success
        runs-on: ubuntu-latest
        needs: [fmt, clippy, test, integration, docs, audit, licenses, shellcheck]
        if: always()
        steps:
            - name: Check all jobs passed
              run: |
                  if [[ "${{ needs.fmt.result }}" != "success" ]] || \
                     [[ "${{ needs.clippy.result }}" != "success" ]] || \
                     [[ "${{ needs.test.result }}" != "success" ]] || \
                     [[ "${{ needs.integration.result }}" != "success" ]] || \
                     [[ "${{ needs.docs.result }}" != "success" ]] || \
                     [[ "${{ needs.audit.result }}" != "success" ]] || \
                     [[ "${{ needs.licenses.result }}" != "success" ]] || \
                     [[ "${{ needs.shellcheck.result }}" != "success" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                  fi
                  echo "All CI checks passed!"
