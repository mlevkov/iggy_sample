services:
    # Apache Iggy message streaming server
    # Pinned to the release paired with the Rust SDK 0.12 line (see Cargo.toml).
    # Server and SDK upgrade together, and 0.10 refuses to boot on 0.9 data,
    # hence the versioned data volume below (ADR-0001, ADR-0002).
    iggy:
        image: apache/iggy:0.10.0
        container_name: iggy-server
        # io_uring needs these instead of full `privileged` (upstream's own
        # compose uses the same set)
        cap_add:
            - SYS_NICE
        security_opt:
            - seccomp:unconfined
        ulimits:
            memlock:
                soft: -1
                hard: -1
        ports:
            # TCP transport (default)
            - "8090:8090"
            # QUIC transport
            - "8080:8080"
            # HTTP transport (also serves /metrics for Prometheus)
            - "3000:3000"
        volumes:
            - iggy_data_0_10:/iggy/data
        environment:
            # Root user credentials
            - IGGY_ROOT_USERNAME=iggy
            - IGGY_ROOT_PASSWORD=iggy
            # Data directory, set explicitly: the default `local_data` is
            # relative to the image's /app working directory
            - IGGY_PATH=/iggy/data
            # Listeners (the image defaults them to loopback)
            - IGGY_HTTP_ENABLED=true
            - IGGY_HTTP_ADDRESS=0.0.0.0:3000
            - IGGY_TCP_ENABLED=true
            - IGGY_TCP_ADDRESS=0.0.0.0:8090
            - IGGY_QUIC_ENABLED=true
            - IGGY_QUIC_ADDRESS=0.0.0.0:8080
            # Unused here, and on by default bound to loopback, where nothing
            # outside the container reaches it
            - IGGY_WEBSOCKET_ENABLED=false
            # The server refuses a wildcard bind unless it knows the address
            # clients dial; in-network clients reach this container as `iggy`
            - IGGY_NODE_ADVERTISED_ADDRESS=iggy
            # Metrics endpoint (Prometheus-compatible). Since 0.9 it requires
            # a bearer credential; see iggy-pat-init below
            - IGGY_HTTP_METRICS_ENABLED=true
            - IGGY_HTTP_METRICS_ENDPOINT=/metrics
            # Web UI served by the server itself at http://localhost:3000/ui
            # (embedded since 0.9; it replaced the separate iggy-web-ui container)
            - IGGY_HTTP_WEB_UI=true
        healthcheck:
            test: ["CMD", "iggy", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        networks:
            - iggy-network

    # One-shot: create the personal access token Prometheus scrapes /metrics
    # with. The token is shown only at creation, so every run deletes and
    # recreates it. The delete may exit non-zero (the CLI finds no keyring in
    # the container) even when it succeeds; the create must not, so a failure
    # stops Prometheus from starting instead of leaving its panels blank.
    iggy-pat-init:
        image: apache/iggy:0.10.0
        container_name: iggy-pat-init
        entrypoint: ["/bin/sh", "/scripts/iggy-pat-init.sh"]
        volumes:
            - ./observability/iggy-pat-init.sh:/scripts/iggy-pat-init.sh:ro
            - iggy_secrets:/secrets
        depends_on:
            iggy:
                condition: service_healthy
        restart: "no"
        networks:
            - iggy-network

    # Sample application
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: iggy-sample-app
        ports:
            - "8000:8000"
            # App Prometheus metrics (host 9091; 9090 is Prometheus itself)
            - "9091:9090"
        environment:
            - HOST=0.0.0.0
            - PORT=8000
            # Dedicated Prometheus metrics listener (scraped as app:9090)
            - METRICS_PORT=9090
            - IGGY_CONNECTION_STRING=iggy://iggy:iggy@iggy:8090
            - IGGY_STREAM=sample-stream
            - IGGY_TOPIC=events
            - IGGY_PARTITIONS=3
            - RUST_LOG=info,iggy_sample=debug
        depends_on:
            iggy:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - iggy-network

    # Prometheus metrics collection
    prometheus:
        image: prom/prometheus:latest
        container_name: iggy-prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
            # Bearer token for the Iggy /metrics scrape (written by iggy-pat-init)
            - iggy_secrets:/etc/prometheus/secrets:ro
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--web.enable-lifecycle"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
        depends_on:
            iggy-pat-init:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            - iggy-network

    # Grafana visualization
    grafana:
        image: grafana/grafana:latest
        container_name: iggy-grafana
        ports:
            - "3001:3000"
        volumes:
            - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
            - grafana_data:/var/lib/grafana
        environment:
            # Default admin credentials (change in production)
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
            # Allow anonymous access for local development
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
            # Server settings
            - GF_SERVER_ROOT_URL=http://localhost:3001
            # Provisioning
            - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
        depends_on:
            - prometheus
        restart: unless-stopped
        networks:
            - iggy-network

volumes:
    # Versioned: no release so far reads the previous one's data (0.10
    # refuses 0.9 data at startup), and upstream promises no migration before
    # 1.0. A server upgrade that breaks the format gets a new volume rather
    # than booting on the old one.
    iggy_data_0_10:
        driver: local
    # Holds the Prometheus scrape token for Iggy /metrics
    iggy_secrets:
        driver: local
    prometheus_data:
        driver: local
    grafana_data:
        driver: local

networks:
    iggy-network:
        driver: bridge
