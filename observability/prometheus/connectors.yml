# Scrape jobs for the connectors demo. docker-compose.connectors.yaml mounts
# this file into /etc/prometheus/scrape.d/, which prometheus.yml includes.

scrape_configs:
  # Connector runtime: connectors running, messages produced, consumed and
  # processed, errors and per-stage latency. Its API requires the api-key
  # header, generated by connectors-init into the iggy_secrets volume.
  - job_name: 'iggy-connectors'
    static_configs:
      - targets: ['connectors:8081']
    metrics_path: '/metrics'
    scheme: 'http'
    http_headers:
      api-key:
        files:
          - /etc/prometheus/secrets/connectors_api_key

  # The HTTP source's admin listener: webhook requests by status, buffer
  # use, rejections. Unauthenticated, so it listens on the compose network
  # only.
  - job_name: 'iggy-connectors-webhooks'
    static_configs:
      - targets: ['connectors:8086']
    metrics_path: '/admin/metrics'
    scheme: 'http'
