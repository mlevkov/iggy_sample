[package]
name = "iggy_sample"
version = "0.4.1"
edition = "2024"
rust-version = "1.93.0"
description = "A comprehensive demonstration of Apache Iggy message streaming with Axum"
license = "MIT"
# Repo-level releases only - never published to crates.io (enforced here,
# not just in CI: cargo refuses to publish with this set). release.yml still
# runs a publish job, which fails silently: with no token it stops before
# reaching this setting, and with one this would stop it. TD-2026-09-04.
publish = false
repository = "https://github.com/mlevkov/iggy_sample"
homepage = "https://github.com/mlevkov/iggy_sample"
documentation = "https://mlevkov.github.io/iggy_sample"
authors = ["Maxim Levkov"]
keywords = ["iggy", "message-streaming", "axum", "async", "event-driven"]
categories = ["web-programming", "asynchronous", "network-programming"]
readme = "README.md"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "request-id", "propagate-header"] }

# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Message streaming (Apache Iggy Rust SDK; 0.10 pairs with the server-0.8 line)
iggy = "0.10.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Configuration
dotenvy = "0.15"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Decimal arithmetic for monetary values (avoids floating-point precision issues).
# 1.43 floor: earlier releases pin an unpatchable rkyv 0.7 into Cargo.lock
# (RUSTSEC-2026-0235) via the weak "rkyv?/std" feature, even though it is never built.
rust_decimal = { version = "1.43", features = ["serde", "serde-with-str"] }

# Random number generation (for jitter in backoff)
rand = "0.10"

# Rate limiting
governor = "0.10"

# Security - password hashing for API key validation (constant-time comparison)
subtle = "2.6"

# Exit codes (BSD sysexits compatible)
exitcode = "1.1"

# Metrics for Prometheus
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
testcontainers = "0.28"
# test-util unlocks tokio::time::pause()/advance() for the paused-clock
# resilience matrix (TD-2026-07-01); dev-only so production builds are
# unaffected.
tokio = { version = "1.52", features = ["full", "test-util"] }

# =============================================================================
# Lints Configuration
# =============================================================================
# Deny panicking methods in production code to ensure proper error handling.
# Use `#[allow(clippy::unwrap_used)]` in tests where panics are acceptable.

[lints.clippy]
# Deny methods that can panic - forces proper error handling
unwrap_used = "deny"
expect_used = "deny"
# Also deny panicking index operations
indexing_slicing = "warn"

[lints.rust]
# Ensure unsafe code is explicitly allowed where needed
unsafe_code = "warn"

# release building
[profile.release]
debug = true
codegen-units = 1
lto = true
# Load-bearing beyond binary size: CircuitBreaker::lock recovers a poisoned
# state mutex rather than propagating, and its justification is that a panic
# under the guard aborts here instead of unwinding into a poisoned lock. The
# recovery path is therefore unreachable in release and exercised only by
# `cargo test`. Changing this means revisiting that reasoning.
panic = "abort"
